packages:
  - "apps/*"
  - "packages/*"
  - "tests/*"
  - "tooling/*"

# pnpm 10 blocks dependency build scripts unless allow-listed; wrangler's
# workerd and esbuild need theirs to verify their platform binaries. The
# template's other native helpers (@parcel/watcher, unrs-resolver, vue-demi)
# stay unbuilt, as upstream allows them no build either.
onlyBuiltDependencies:
  - esbuild
  - workerd

overrides:
  # The template's own pin: h3 v1, because nuxt-csurf still uses the v1 event
  # API (event.req.headers.get) and breaks on h3 v2.
  h3: 1.15.11
